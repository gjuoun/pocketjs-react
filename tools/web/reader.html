<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pocketjs-react reader</title>
<style>
  body { background: #0f172a; color: #e2e8f0; font: 13px system-ui, sans-serif; margin: 16px; }
  canvas { width: 960px; height: 544px; image-rendering: pixelated; display: block; margin: 8px 0; }
  @media (pointer: coarse) { canvas { width: 100%; max-width: 960px; height: auto; image-rendering: auto; } }
  #bar { display: flex; gap: 12px; align-items: center; }
</style>
<div id="bar">
  <label>Add books (EPUB): <input id="pick" type="file" multiple accept=".epub"></label>
  <span id="status"></span>
</div>
<textarea id="native-entry" tabindex="-1" aria-hidden="true" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;resize:none"></textarea>
<canvas id="screen" width="480" height="272"></canvas>
<div>Keys: arrows = d-pad, Enter/Z = CIRCLE (confirm), X = CROSS (back), Q/E = L/R, Space = START. Mouse clicks press what they point at.</div>
<script type="module">
  // The app runs through the npm package's own hosts/web/app-instance.js: the wasm core plus
  // text.glyphs.runtime, which draws any codepoint the baked atlases lack (Chinese, Japanese,
  // Korean...) with the browser's fonts. The page owns the rest: a 60 Hz loop, the keyboard,
  // a file picker with a writable fs (globalThis.fs, installed before the bundle evaluates) and
  // mouse clicks (globalThis.__pocketPointer).
  //   ?glyphs=0   runtime glyphs off (the atlases as the build baked them)
  //   ?manual=1   no loop: a driver steps frames with window.__host.step(buttons)
  //   ?touch=1    a touch host (a tap on a field summons the native keyboard); touch screens are detected too
  import { create } from "/app-instance.js";
  import { createBrowserFs } from "/fs-shim.js";
  import { BTN, KEYMAP, bridgeBeforeInput, bridgeCompositionEnd, bridgeCompositionStart, createBridgeState, createFocusFollower, routeKey } from "/text-entry-host.js";

  const params = new URLSearchParams(location.search);
  const runtimeGlyphs = params.get("glyphs") !== "0";
  const manual = params.get("manual") === "1";
  const fs = createBrowserFs();
  const canvas = document.getElementById("screen");
  // C4c: on a touch host a tap on an editable field focuses the hidden textarea, so the native
  // keyboard (and its IME) types into the guest field through the same __pocketText seam.
  const nativeEntry = document.getElementById("native-entry");
  // The hidden entry always holds one zero-width character. A native Backspace then always has content
  // to delete, so the browser sends beforeinput for it (the iOS report: no keyboard Backspace on an
  // empty field; WebKit's exact rule is unverified here, and Chromium sends it either way).
  const NATIVE_SENTINEL = "\u200b";
  const armNative = () => {
    if (nativeEntry.value !== NATIVE_SENTINEL) nativeEntry.value = NATIVE_SENTINEL;
    nativeEntry.setSelectionRange(1, 1);
  };
  const touchHost = params.get("touch") === "1" || navigator.maxTouchPoints > 0;
  globalThis.__pocketTextNative = touchHost;
  // Hover: only this web host sets the gate, so native hosts never build the hover overlay.
  globalThis.__pocketHover = true;
  const bridge = createBridgeState();
  const follow = createFocusFollower();
  const emitText = (event) => (globalThis.__pocketText ??= []).push(event);
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(canvas.width, canvas.height);
  let inst = null;
  let keys = 0; // keyboard
  let virtual = 0; // window.__host.press
  // Each change of the level (keys | virtual) queues one sample: the level right after the change.
  // The rAF loop takes one sample per step, so every press reaches the guest as a raise then a fall, even
  // when keydown and keyup land between two rAF callbacks or 2-6 ms apart. A steady level queues nothing:
  // a key held across frames stays one hold. Not used in manual mode (the driver passes buttons itself).
  const samples = [];
  const SAMPLE_CAP = 256; // a backlog never replays more than this many steps of old input
  const level = () => keys | virtual;
  const sampleChange = (before) => {
    if (manual || level() === before) return;
    samples.push(level());
    if (samples.length > SAMPLE_CAP) samples.shift();
  };
  const nextSample = () => (samples.length ? samples.shift() : level());

  const draw = () => {
    if (!inst) return;
    image.data.set(inst.render());
    ctx.putImageData(image, 0, 0);
  };
  /** One frame: the guest's frame(buttons) (runtime glyphs flushed inside), the core tick. Returns its ms. */
  const step = (buttons = keys | virtual) => {
    if (!inst) return 0;
    const t = performance.now();
    try {
      inst.step(buttons);
    } catch (e) {
      (window.__log ??= []).push("FRAME ERROR: " + (e && e.stack ? e.stack : e));
      inst = null;
    }
    // The native keyboard leaves only when the guest field loses focus (an edge, not a level: see createFocusFollower).
    if (follow.update(globalThis.__pocketTextEntry === true) && document.activeElement === nativeEntry) nativeEntry.blur();
    return performance.now() - t;
  };
  const start = async () => {
    const previous = inst;
    inst = null;
    previous?.dispose();
    globalThis.fs = fs.ns;
    globalThis.__pocketPointer = [];
    globalThis.__pocketRuntimeGlyphs = runtimeGlyphs; // the reader warms glyphs only where they are drawn at run time
    const t = performance.now();
    inst = await create({ wasmUrl: "/pocketjs.wasm", pakUrl: "/dist/app.pak", bundleUrl: "/dist/app.js", packageId: "app", runtimeGlyphs, text: false });
    window.__host.createMs = performance.now() - t;
    document.getElementById("status").textContent = fs.pickedNames().length ? "books/: " + fs.pickedNames().join(", ") : "";
  };

  window.__host = {
    BTN,
    createMs: 0,
    starts: 0,
    get instance() { return inst; },
    press(bit, down) { const before = level(); virtual = down ? virtual | bit : virtual & ~bit; sampleChange(before); },
    step,
    draw,
    /** Text runs the core draws, as "x,y,w,h<TAB>text" lines. */
    texts() { if (!inst) return ""; globalThis.ui.captureTexts(0, 0); inst.render(); return String(globalThis.ui.capturedTexts(0) ?? ""); },
    glyphStats() { return inst ? inst.glyphStats() : null; },
    pixels() { return inst ? inst.render() : null; },
  };

  // Keys: a focused text field (guest flag) takes printable keys as text; otherwise the pad mapping.
  window.addEventListener("keydown", (e) => {
    if (e.target === nativeEntry) {
      // Native text arrives through the hidden field's beforeinput; Escape closes the keyboard here.
      if (e.key === "Escape") { emitText({ t: "key", k: "Escape" }); nativeEntry.blur(); }
      return;
    }
    const r = routeKey(e, globalThis.__pocketTextEntry === true, globalThis.__pocketTextMultiline === true);
    if (!r) return;
    e.preventDefault();
    if (r.to === "button") { const before = level(); keys |= r.bit; sampleChange(before); }
    else (globalThis.__pocketText ??= []).push(r.to === "text" ? { t: "ch", s: r.ch } : { t: "key", k: r.key });
  });
  window.addEventListener("keyup", (e) => { const bit = KEYMAP[e.code]; if (bit === undefined) return; e.preventDefault(); const before = level(); keys &= ~bit; sampleChange(before); });
  window.addEventListener("blur", () => { const before = level(); keys = 0; sampleChange(before); });
  document.getElementById("pick").addEventListener("change", async (event) => {
    await fs.addFiles(event.target.files);
    await start(); // reload the app so its library lists the new files
    window.__host.starts++;
    window.__picked = true;
  });
  const point = (event, down) => {
    const r = canvas.getBoundingClientRect();
    (globalThis.__pocketPointer ??= []).push({ x: ((event.clientX - r.left) / r.width) * canvas.width, y: ((event.clientY - r.top) / r.height) * canvas.height, down });
  };
    // On a touch host the mouse events are the browser's echo of the tap. A mousedown on the
  // non-focusable canvas would move focus and blur the native entry, so it keeps its focus.
  canvas.addEventListener("mousedown", (e) => {
    if (touchHost) e.preventDefault();
    point(e, true);
  });
  canvas.addEventListener("mouseup", (e) => point(e, false));
  // Hover: a mouse moving over the canvas lights the menu row under it; a touch is not a hover.
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const r = canvas.getBoundingClientRect();
    (globalThis.__pocketPointer ??= []).push({ x: ((e.clientX - r.left) / r.width) * canvas.width, y: ((e.clientY - r.top) / r.height) * canvas.height, move: true });
  });
  canvas.addEventListener("pointerleave", (e) => {
    if (e.pointerType === "mouse") (globalThis.__pocketPointer ??= []).push({ leave: true });
  });
  // A finger lift decides inside the gesture whether the native keyboard comes up: a tap on an
  // editable field focuses the hidden textarea; a tap anywhere else lets it go.
  canvas.addEventListener("pointerup", (e) => {
    if (!touchHost || e.pointerType !== "touch") return;
    const r = canvas.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * canvas.width;
    const y = ((e.clientY - r.top) / r.height) * canvas.height;
    if (globalThis.__pocketTextHitAt?.(x, y)) {
      armNative();
      nativeEntry.focus({ preventScroll: true }); // still inside the pointerup gesture (iOS)
    }
    else if (document.activeElement === nativeEntry) nativeEntry.blur();
  });
  nativeEntry.addEventListener("compositionstart", () => bridgeCompositionStart(bridge));
  nativeEntry.addEventListener("compositionend", (e) => {
    bridgeCompositionEnd(bridge, e.data, emitText);
    setTimeout(() => { armNative(); }, 0); // the composed text is in the field; the seam has it, so reset to the sentinel
  });
  nativeEntry.addEventListener("beforeinput", (e) => {
    if (bridgeBeforeInput(bridge, e, emitText)) e.preventDefault();
    // Enter ends a single-line field's native keyboard, as its commit closes the field.
    if (e.inputType === "insertLineBreak" && globalThis.__pocketTextMultiline !== true) nativeEntry.blur();
  });

  if (!manual) {
    // Fixed 60 Hz steps on requestAnimationFrame, at most 4 per refresh after a stall.
    let last = performance.now();
    let acc = 0;
    const loop = (now) => {
      requestAnimationFrame(loop);
      acc += Math.min(250, now - last);
      last = now;
      let steps = 0;
      while (acc >= 1000 / 60 && steps < 4) { step(nextSample()); acc -= 1000 / 60; steps++; }
      if (steps > 0) draw();
    };
    requestAnimationFrame(loop);
  }
  await start();
  window.__host.starts++;
  window.__ready = true;
</script>
